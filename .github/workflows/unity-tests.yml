name: Unity tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  edit-mode-tests:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check Unity license configuration
        id: unity-license
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" ]] || [[ -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity tests skipped::Configure UNITY_LICENSE, or UNITY_SERIAL with UNITY_EMAIL and UNITY_PASSWORD, as repository secrets."
          fi
      - name: Run Unity EditMode tests
        if: steps.unity-license.outputs.configured == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          unityVersion: 6000.3.10f1
          testMode: EditMode
          artifactsPath: test-artifacts
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.unity-license.outputs.configured == 'true' }}
        with:
          name: unity-test-results
          path: test-artifacts
